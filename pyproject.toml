[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trm_analises"
version = "0.1.0"
dependencies = [
    "duckdb>=0.9.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["."]
testpaths = ["tests"]